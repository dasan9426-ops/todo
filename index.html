<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TODO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235048e5'/><path d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">TODO</h1>
      <time class="app-date" id="today"></time>
    </header>

    <form class="add-form card" id="add-form" autocomplete="off">
      <label class="visually-hidden" for="new-title">新しいタスク</label>
      <input class="input add-title" id="new-title" type="text" placeholder="やることを入力して Enter" maxlength="200" autofocus>
      <label class="visually-hidden" for="new-due">期限（任意）</label>
      <input class="input add-due" id="new-due" type="date" title="期限（任意）">
      <button class="btn btn-primary" type="submit">追加</button>
    </form>

    <p class="notice" id="notice" role="alert" hidden></p>

    <section class="todo-panel card" aria-label="タスク一覧">
      <div class="toolbar" id="toolbar" hidden>
        <nav class="filters" aria-label="表示するタスク">
          <a href="#/" data-filter="all">すべて</a>
          <a href="#/active" data-filter="active">未完了</a>
          <a href="#/completed" data-filter="completed">完了済み</a>
        </nav>
        <button class="btn btn-text" id="toggle-all" type="button">すべて完了にする</button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty" id="empty-message" hidden></p>

      <div class="panel-footer" id="footer" hidden>
        <span id="count" aria-live="polite"></span>
        <button class="btn btn-text btn-danger-text" id="clear-completed" type="button" hidden>完了済みを削除</button>
      </div>
    </section>
  </main>

  <script src="js/todo-model.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
